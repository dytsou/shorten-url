name: Deploy to GitHub Pages

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:
    inputs:
      custom_domain:
        description: "Custom domain for CNAME"
        required: false
        default: ""

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Handle CNAME
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          DISPATCH_CUSTOM_DOMAIN: ${{ github.event.inputs.custom_domain }}
        run: |
          # Check for custom domain from workflow dispatch
          if [ -n "$DISPATCH_CUSTOM_DOMAIN" ]; then
            echo "Using custom domain from workflow dispatch"
            printf '%s\n' "$DISPATCH_CUSTOM_DOMAIN" > docs/CNAME
            cat docs/CNAME
          # Check for custom domain from secrets
          elif [ -n "$CUSTOM_DOMAIN" ]; then
            echo "Using custom domain from secrets"
            printf '%s\n' "$CUSTOM_DOMAIN" > docs/CNAME
          else
            echo "No custom domain specified, using default GitHub Pages URL"
            if [ -f "docs/CNAME" ]; then
              rm docs/CNAME
              echo "Removed existing CNAME file"
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/production'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
